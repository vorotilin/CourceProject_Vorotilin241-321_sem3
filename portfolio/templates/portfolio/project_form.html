<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if object %}Редактировать проект{% else %}Добавить проект{% endif %}</title>
</head>
<body>
    <h1>{% if object %}Редактировать проект{% else %}Добавить новый проект{% endif %}</h1>
    <p><a href="{% url 'portfolio:project_list' %}">Назад к списку</a></p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
</body>
</html>
